<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoBoost - Entrar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #07111f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #101c2e;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .logo span {
            color: #35a7ff;
        }

        .subtitle {
            text-align: center;
            color: #9caec4;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            background: #091525;
            border-radius: 10px;
            padding: 4px;
        }

        .tabs button {
            width: 50%;
            border: none;
            padding: 12px;
            border-radius: 8px;
            background: transparent;
            color: #9caec4;
            cursor: pointer;
            font-size: 15px;
        }

        .tabs button.active {
            background: #168cff;
            color: white;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #dce7f5;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #263952;
            border-radius: 10px;
            background: #091525;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #168cff;
        }

        .submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #168cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit:hover {
            background: #0878df;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #9caec4;
            min-height: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #8fa4bd;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Video<span>Boost</span>
    </div>

    <div class="subtitle">
        Sua central de vídeos em massa
    </div>

    <div class="tabs">
        <button id="loginTab" class="active" onclick="showLogin()">
            Entrar
        </button>

        <button id="registerTab" onclick="showRegister()">
            Criar conta
        </button>
    </div>

    <form id="authForm">

        <label>E-mail</label>
        <input
            type="email"
            id="email"
            placeholder="seu@email.com"
            required
        >

        <label>Senha</label>
        <input
            type="password"
            id="password"
            placeholder="Digite sua senha"
            required
        >

        <button class="submit" type="submit" id="submitButton">
            Entrar
        </button>

    </form>

    <div id="message"></div>

    <a href="/" class="back">
        ← Voltar para o início
    </a>

</div>

<script>

const API = "";

let mode = "login";

function showLogin() {
    mode = "login";

    document.getElementById("loginTab").classList.add("active");
    document.getElementById("registerTab").classList.remove("active");

    document.getElementById("submitButton").textContent = "Entrar";
    document.getElementById("message").textContent = "";
}

function showRegister() {
    mode = "register";

    document.getElementById("registerTab").classList.add("active");
    document.getElementById("loginTab").classList.remove("active");

    document.getElementById("submitButton").textContent = "Criar conta";
    document.getElementById("message").textContent = "";
}

document.getElementById("authForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    message.textContent = "Processando...";

    const formData = new FormData();

    formData.append("email", email);
    formData.append("password", password);

    try {

        const endpoint = mode === "login"
            ? "/api/auth/login"
            : "/api/auth/register";

        const response = await fetch(API + endpoint, {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Ocorreu um erro.");
        }

        localStorage.setItem("videoboost_token", data.token);
        localStorage.setItem("videoboost_user", JSON.stringify(data.user));

        message.textContent = "Acesso realizado!";

        setTimeout(() => {
            window.location.href = "/dashboard.html";
        }, 700);

    } catch (error) {

        message.textContent = error.message;

    }

});

</script>

</body>
</html>
