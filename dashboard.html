<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoBoost - Painel</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.upload{background:#151c32;border-radius:16px;padding:18px;margin:12px 0}.upload{text-align:center;border:2px dashed #34405f}.btn{background:#4f7cff;color:white;border:0;padding:12px 16px;border-radius:10px;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap}select,input{padding:11px;border-radius:9px;border:1px solid #34405f;background:#0f1629;color:#fff}.job{border-top:1px solid #2a3450;padding:12px 0}.muted{color:#aab4ce}@media(max-width:700px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>VideoBoost</h1><p class="muted">Editor e operações em massa</p></div><button class="btn" onclick="logout()">Sair</button></div>
<div class="cards"><div class="card">Pendentes<br><b id="pending">0</b></div><div class="card">Concluídos<br><b id="done">0</b></div><div class="card">Total<br><b id="total">0</b></div></div>
<div class="upload"><h2>Enviar vídeos em massa</h2><p class="muted">Selecione vários vídeos de uma vez.</p><input id="fileInput" type="file" accept="video/*" multiple onchange="uploadVideos()"><div class="row" style="justify-content:center;margin-top:12px"><select id="format"><option value="original">Original</option><option value="9:16">Vertical 9:16</option><option value="16:9">Horizontal 16:9</option><option value="1:1">Quadrado 1:1</option></select><input id="editText" placeholder="Texto opcional"></div><p id="status"></p></div>
<div class="card"><div class="row"><button class="btn" onclick="downloadAll()">Baixar disponíveis em ZIP</button><button class="btn" onclick="connectInstagram()">Conectar Instagram</button><button class="btn" onclick="loadSocialAccounts()">Atualizar contas</button></div><p id="social"></p></div>
<div class="card"><h2>Fila de vídeos</h2><div id="jobs">Carregando...</div></div>
</div>
<script>
const token=localStorage.getItem('videoboost_token'); if(!token) location.href='/login.html';
const auth=()=>({'Authorization':'Bearer '+token});
async function loadJobs(){const r=await fetch('/api/jobs',{headers:auth()});if(r.status===401){logout();return}const d=await r.json();document.getElementById('pending').textContent=d.stats.pending;document.getElementById('done').textContent=d.stats.done;document.getElementById('total').textContent=d.stats.total;document.getElementById('jobs').innerHTML=d.jobs.map(j=>`<div class="job"><b>${j.filename}</b><br><span class="muted">${j.status} — ${j.progress}%</span> ${j.output_path?`<button class="btn" onclick="downloadOne('${j.id}')">Baixar</button>`:''}</div>`).join('')||'<p class="muted">Nenhum vídeo ainda.</p>'}
async function uploadVideos(){const input=document.getElementById('fileInput');if(!input.files.length)return;const status=document.getElementById('status');status.textContent='Enviando '+input.files.length+' vídeo(s)...';const f=new FormData();for(const x of input.files)f.append('files',x);f.append('format',document.getElementById('format').value);f.append('text',document.getElementById('editText').value);try{const r=await fetch('/api/jobs',{method:'POST',headers:auth(),body:f});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Falha no envio');status.textContent=d.message||'Enviado!';input.value='';loadJobs()}catch(e){status.textContent='Erro: '+e.message}}
async function downloadOne(id){location.href='/api/jobs/'+id+'/download?token='+encodeURIComponent(token)}
async function downloadAll(){const r=await fetch('/api/downloads/zip',{method:'POST',headers:auth()});if(!r.ok){alert('Nenhum vídeo disponível para baixar.');return}const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='videoboost.zip';a.click()}
async function connectInstagram(){const r=await fetch('/api/social/meta/login',{headers:auth()});const d=await r.json();if(d.url)location.href=d.url;else document.getElementById('social').textContent=d.detail||'Configure a integração Meta no servidor.'}
async function loadSocialAccounts(){const r=await fetch('/api/social/accounts',{headers:auth()});const d=await r.json();document.getElementById('social').textContent=d.accounts?.length?'Contas conectadas: '+d.accounts.length:'Nenhuma conta conectada.'}
function logout(){localStorage.removeItem('videoboost_token');localStorage.removeItem('videoboost_user');location.href='/login.html'}
loadJobs();setInterval(loadJobs,5000);
</script></body></html>
